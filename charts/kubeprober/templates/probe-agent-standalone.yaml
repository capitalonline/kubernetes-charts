apiVersion: v1
data:
  probe-conf.yaml: |
    # Single cluster mode configuration
    namespace: kubeprober
    probe_listen_addr: {{ .Values.probeAgent.config.listenAddr | quote }}
    debug_level: {{ .Values.probeAgent.config.debugLevel }}
kind: ConfigMap
metadata:
  name: probeagent
  namespace: kubeprober
  labels:
    app.kubernetes.io/name: kubeprober
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: extra-config
  namespace: kubeprober
  labels:
    app.kubernetes.io/name: kubeprober
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
{{- if .Values.extraConfig }}
{{- toYaml .Values.extraConfig | nindent 2 }}
{{- else }}
  # Extra configuration for probe pods
  # Add any additional environment variables here
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: probe-agent
    app.kubernetes.io/name: kubeprober
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: probeagent
  namespace: kubeprober
spec:
  type: {{ .Values.probeAgent.service.type }}
  ports:
  - name: probe-status
    port: {{ .Values.probeAgent.service.ports.probeStatus.port }}
    protocol: TCP
    targetPort: {{ .Values.probeAgent.service.ports.probeStatus.targetPort }}
  - name: health
    port: {{ .Values.probeAgent.service.ports.health.port }}
    protocol: TCP
    targetPort: {{ .Values.probeAgent.service.ports.health.targetPort }}
  - name: pprof
    port: {{ .Values.probeAgent.service.ports.pprof.port }}
    protocol: TCP
    targetPort: {{ .Values.probeAgent.service.ports.pprof.targetPort }}
  - name: metrics
    port: {{ .Values.probeAgent.service.ports.metrics.port }}
    protocol: TCP
    targetPort: {{ .Values.probeAgent.service.ports.metrics.targetPort }}
  selector:
    app: probe-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: probe-agent
    app.kubernetes.io/name: kubeprober
    app.kubernetes.io/app-component: kubeprober
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: probe-agent
  namespace: kubeprober
spec:
  replicas: {{ .Values.probeAgent.replicas }}
  selector:
    matchLabels:
      app: probe-agent
  template:
    metadata:
      labels:
        app: probe-agent
        app.kubernetes.io/app-component: kubeprober
        app.kubernetes.io/name: kubeprober
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - args:
        - -c
        - /probe-agent --config-file=/opt/probe-conf.yaml
        command:
        - /bin/sh
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: "{{ .Values.probeAgent.image.repository }}:{{ .Values.probeAgent.image.tag }}"
        imagePullPolicy: {{ .Values.probeAgent.image.pullPolicy }}
        livenessProbe:
{{- toYaml .Values.probeAgent.livenessProbe | nindent 10 }}
        name: probe-agent
        readinessProbe:
{{- toYaml .Values.probeAgent.readinessProbe | nindent 10 }}
        resources:
{{- toYaml .Values.probeAgent.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /opt
          name: probe-config-volume
      serviceAccountName: {{ .Values.serviceAccount.probeAgent }}
      terminationGracePeriodSeconds: 10
      volumes:
      - configMap:
          name: probeagent
        name: probe-config-volume
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    name: nsenter
    app.kubernetes.io/name: kubeprober
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: nsenter
  namespace: kubeprober
spec:
  selector:
    matchLabels:
      name: nsenter
  template:
    metadata:
      labels:
        name: nsenter
        app.kubernetes.io/name: kubeprober
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - command:
        - nsenter
        - --target
        - "1"
        - --mount
        - --uts
        - --ipc
        - --net
        - --pid
        - --
        - env
        - TMOUT=0
        - bash
        - --noprofile
        - -l
        image: "{{ .Values.nsenter.image.repository }}:{{ .Values.nsenter.image.tag }}"
        imagePullPolicy: {{ .Values.nsenter.image.pullPolicy }}
        name: nsenter
        resources:
{{- toYaml .Values.nsenter.resources | nindent 10 }}
        securityContext:
          privileged: true
        stdin: true
        stdinOnce: true
        tty: true
      hostNetwork: {{ .Values.nsenter.hostNetwork }}
      hostPID: {{ .Values.nsenter.hostPID }}
      restartPolicy: Always
      serviceAccountName: default
      tolerations:
{{- toYaml .Values.nsenter.tolerations | nindent 6 }}
---
apiVersion: kubeprober.erda.cloud/v1
kind: Alert
metadata:
  name: eks-internal
  namespace: default
spec:
  address: https://qyapi.weixin.qq.com
  token: {{ .Values.alertToken | quote }}
  blackList: []
  type: wecom
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cds-customer-info
  namespace: kubeprober
  labels:
    app.kubernetes.io/name: kubeprober
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  env: {{ .Values.env | quote }}
  customer_id: {{ .Values.customerId | quote }}
---