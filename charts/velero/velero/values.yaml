# Default values for velero.
# This is a YAML-formatted file.
# Declare variables to be substituted into your templates.

# ==========================================
# 部署说明
# ==========================================
# 安装命令：
#   helm install velero ./charts/velero -n velero --create-namespace
#
# 升级命令：
#   helm upgrade velero ./charts/velero -n velero
#
# 卸载命令：
#   helm uninstall velero -n velero
#   注意：CRD 不会被自动删除，如需删除请手动执行：
#   kubectl delete crd -l app.kubernetes.io/name=velero

# ==========================================
# Container Configuration
# ==========================================
container:
  # Velero 主服务镜像
  velero:
    image:
      repository: velero/velero
      tag: "v1.18.0"
      pullPolicy: IfNotPresent

  # AWS/S3 兼容存储插件镜像（init container）
  velero-plugin-for-aws:
    image:
      repository: velero/velero-plugin-for-aws
      tag: "v1.13.0"
      pullPolicy: IfNotPresent

# ==========================================
# RBAC Configuration
# ==========================================
serviceAccount:
  name: velero

# ==========================================
# 备份凭据配置
# ==========================================
credentials:
  # 是否使用 Secret 存储凭据（推荐 true）
  useSecret: false
  # Secret 名称
  name: velero-credentials
  # 凭据内容（AWS/S3 兼容格式，云厂商 OSS 请填写对应的 AccessKey）
  secretContents:
    cloud: |
      [default]
      aws_access_key_id = <YOUR_ACCESS_KEY_ID>
      aws_secret_access_key = <YOUR_ACCESS_KEY_SECRET>

# ==========================================
# Backup Storage Location 配置
# ==========================================
backupStorageLocation:
  # 是否创建 BackupStorageLocation（部署时不配置存储可设为 false，后续手动创建）
  enabled: false
  # 名称
  name: default
  # 存储提供商：aws（S3 兼容）
  provider: aws
  # 是否默认位置
  default: true
  # S3 存储桶名称
  bucket: velero
  # 存储桶中的路径前缀（可为空）
  prefix: ""
  # 访问模式：ReadWrite 或 ReadOnly
  accessMode: ReadWrite
  config:
    # S3 区域（按云厂商填写，）
    region: cn-hangzhou
    # 强制使用路径风格 URL（MinIO 必须为 true，大多数云厂商 OSS 设为 false）
    s3ForcePathStyle: "false"
    # S3 服务地址（云厂商 OSS endpoint，如：https://oss-high-qy01.cdsgss.com/velero）
    s3Url: "https://<YOUR_OSS_ENDPOINT>"
    # 公开访问地址（可为空）
    publicUrl: ""

# ==========================================
# Volume Snapshot Location 配置
# ==========================================
volumeSnapshotLocation:
  # 是否创建 VolumeSnapshotLocation（部署时不配置存储可设为 false，后续手动创建）
  enabled: false
  # 名称
  name: default
  # 存储提供商
  provider: aws
  config:
    region: minio

# ==========================================
# Velero Server 配置
# ==========================================
configuration:
  # 功能特性开关（逗号分隔，可留空）
  # 例如：EnableCSI
  features: ""
  # 文件系统备份工具：kopia 或 restic（推荐 kopia）
  uploaderType: kopia
  # 默认备份存储位置名称
  defaultBackupStorageLocation: default
  # 默认卷快照存储位置名称
  defaultVolumeSnapshotLocations: "aws:default"
  # 默认备份 TTL（保留时间）
  defaultBackupTTL: 720h0m0s
  # 日志级别：info, debug, warning, error, fatal, panic
  logLevel: info
  # 日志格式：text 或 json
  logFormat: text
  # 垃圾回收频率
  garbageCollectionFrequency: 1h

# ==========================================
# Deployment 配置
# ==========================================
deployment:
  # 副本数（建议 1，velero 不支持多副本并发备份）
  replicas: 1
  # 资源限制（可按需调整）
  resources:
    requests:
      cpu: 500m
      memory: 128Mi
    limits:
      memory: 512Mi
  # 节点选择器
  nodeSelector: {}
  # 容忍配置
  tolerations: []
  # 亲和性配置
  affinity: {}

# ==========================================
# Node Agent（文件系统备份）配置
# ==========================================
nodeAgent:
  # 是否启用 node-agent DaemonSet（用于文件系统级别的 PVC 备份）
  enabled: false
  # kubelet 数据目录（不同发行版可能不同）
  podVolumePath: /var/lib/kubelet/pods
  # 资源限制
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi
  # 容忍配置（建议设置为所有节点）
  tolerations:
    - operator: "Exists"
