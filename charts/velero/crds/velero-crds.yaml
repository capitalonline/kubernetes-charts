apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.velero.io
  labels:
    app.kubernetes.io/name: velero
    component: velero
spec:
  group: velero.io
  names:
    kind: Backup
    listKind: BackupList
    plural: backups
    singular: backup
    categories:
      - velero
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Backup phase (New, InProgress, Uploading, Uploading, Completed, PartiallyFailed, Failed, Deleting)"
                errors:
                  type: integer
                  description: "Number of errors encountered during backup"
                warnings:
                  type: integer
                  description: "Number of warnings encountered during backup"
                startTimestamp:
                  type: string
                  format: date-time
                  description: "Time when the backup started"
                completionTimestamp:
                  type: string
                  format: date-time
                  description: "Time when the backup completed"
                expiration:
                  type: string
                  format: date-time
                  description: "Time when the backup expires"
                version:
                  type: integer
                  description: "Backup format version"
                progress:
                  type: object
                  properties:
                    totalItems:
                      type: integer
                    itemsBackedUp:
                      type: integer
                  x-kubernetes-preserve-unknown-fields: true
                validationErrors:
                  type: array
                  items:
                    type: string
                  nullable: true
                formatVersion:
                  type: string
                csiVolumeSnapshotsAttempted:
                  type: integer
                csiVolumeSnapshotsCompleted:
                  type: integer
                failureReason:
                  type: string
                hookStatus:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                backupItemOperationsAttempted:
                  type: integer
                backupItemOperationsCompleted:
                  type: integer
                backupItemOperationsFailed:
                  type: integer
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: STATUS
          type: string
          description: Backup status
          jsonPath: .status.phase
        - name: ERRORS
          type: integer
          description: Number of errors
          jsonPath: .status.errors
        - name: WARNINGS
          type: integer
          description: Number of warnings
          jsonPath: .status.warnings
        - name: CREATED
          type: date
          description: Backup start time
          jsonPath: .status.startTimestamp
        - name: EXPIRES
          type: date
          description: Expiration time
          jsonPath: .status.expiration
        - name: STORAGE LOCATION
          type: string
          description: Backup storage location
          jsonPath: .spec.storageLocation
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
