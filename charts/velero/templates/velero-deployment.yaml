apiVersion: apps/v1
kind: Deployment
metadata:
  name: velero
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/app-component: velero
    app: velero
    component: velero
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: velero
      component: velero
  template:
    metadata:
      labels:
        app.kubernetes.io/app-component: velero
        app: velero
        component: velero
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 3600
      {{- if .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.deployment.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml .Values.deployment.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.affinity }}
      affinity:
        {{- toYaml .Values.deployment.affinity | nindent 8 }}
      {{- end }}
      initContainers:
        - name: velero-plugin-for-aws
          image: {{ index .Values.container "velero-plugin-for-aws" "image" "repository" }}:{{ index .Values.container "velero-plugin-for-aws" "image" "tag" }}
          imagePullPolicy: {{ index .Values.container "velero-plugin-for-aws" "image" "pullPolicy" }}
          volumeMounts:
            - name: plugins
              mountPath: /target
      containers:
        - name: velero
          image: {{ .Values.container.velero.image.repository }}:{{ .Values.container.velero.image.tag }}
          imagePullPolicy: {{ .Values.container.velero.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8085
              protocol: TCP
          command:
            - /velero
          args:
            - server
            {{- if .Values.configuration.features }}
            - --features={{ .Values.configuration.features }}
            {{- end }}
            - --uploader-type={{ .Values.configuration.uploaderType }}
            {{- if .Values.backupStorageLocation.enabled }}
            - --default-backup-storage-location={{ .Values.configuration.defaultBackupStorageLocation }}
            {{- end }}
            {{- if and .Values.volumeSnapshotLocation.enabled .Values.configuration.defaultVolumeSnapshotLocations }}
            - --default-volume-snapshot-locations={{ .Values.configuration.defaultVolumeSnapshotLocations }}
            {{- end }}
            - --default-backup-ttl={{ .Values.configuration.defaultBackupTTL }}
            - --log-level={{ .Values.configuration.logLevel }}
            - --log-format={{ .Values.configuration.logFormat }}
            - --garbage-collection-frequency={{ .Values.configuration.garbageCollectionFrequency }}
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: VELERO_SCRATCH_DIR
              value: /scratch
            - name: VELERO_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: LD_LIBRARY_PATH
              value: /plugins
            {{- if .Values.credentials.useSecret }}
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /credentials/cloud
            {{- end }}
          volumeMounts:
            - name: plugins
              mountPath: /plugins
            - name: scratch
              mountPath: /scratch
            {{- if .Values.credentials.useSecret }}
            - name: credentials
              mountPath: /credentials
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.deployment.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8085
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8085
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
      volumes:
        - name: plugins
          emptyDir: {}
        - name: scratch
          emptyDir: {}
        {{- if .Values.credentials.useSecret }}
        - name: credentials
          secret:
            secretName: {{ .Values.credentials.name }}
        {{- end }}
