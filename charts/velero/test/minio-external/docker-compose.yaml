services:
  minio:
    image: registry-cds.yun-paas.com/cds-eks/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "< /dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 自动创建 velero bucket，MinIO 就绪后执行一次
  mc:
    image: registry-cds.yun-paas.com/cds-eks/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minio minio123 &&
        mc mb local/velero --ignore-existing &&
        echo 'Bucket velero is ready.'
      "
    restart: "no"
