{{- if .Values.secrets.certs.create }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    k8s-app: kubernetes-dashboard
  name: kubernetes-dashboard-certs
  namespace: {{ .Values.namespace.name }}
type: Opaque
{{- end }}

---

{{- if .Values.secrets.csrf.create }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    k8s-app: kubernetes-dashboard
  name: kubernetes-dashboard-csrf
  namespace: {{ .Values.namespace.name }}
type: Opaque
data:
  csrf: ""
{{- end }}

---

{{- if .Values.secrets.keyHolder.create }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    k8s-app: kubernetes-dashboard
  name: kubernetes-dashboard-key-holder
  namespace: {{ .Values.namespace.name }}
type: Opaque
{{- end }}
