apiVersion: v1
kind: Service
metadata:
  name: alertmanager-webhook-adapter
  namespace: monitoring
  labels:
    app: alertmanager-webhook-adapter
    app.kubernetes.io/name: webhook-adapter
    app.kubernetes.io/component: webhook
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: 8090
      protocol: TCP
      name: http
  selector:
    app: alertmanager-webhook-adapter
  sessionAffinity: None

