# ==========================================
# Component Configuration
# ==========================================
grafana:
  storage:
    storageClassName: default-local-sc
    size: 20Gi

ingress:
  hosts:
    - k8s.grafana
    - k8s_internal.grafana

# ==========================================
# Container Configuration (Unified Namespace)
# ==========================================
container:
  # Grafana main container
  grafana:
    image:
      repository: capitalonline/grafana
      tag: 10.3.1

