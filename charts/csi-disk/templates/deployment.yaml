apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/app-component: csi-disk
  name: eks-disk-csi-cds-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eks-disk-csi-cds-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/app-component: csi-disk
        app: eks-disk-csi-cds-controller
        type: csi-provisioner
    spec:
      {{- with .Values.hostAliases }}
      hostAliases:
{{ toYaml . | indent 6 }}
      {{- end }}
      containers:
        - args:
            - --endpoint=$(CSI_ENDPOINT)
            - --v=5
            - --driver=eks-disk.csi.cds.net
          env:
            - name: CSI_ENDPOINT
              value: unix://socketDir/csi.sock
            - name: CDS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: access_key_id
                  name: eks-secrets
            - name: CDS_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  key: access_key_secret
                  name: eks-secrets
            - name: CDS_OVERSEA
              valueFrom:
                configMapKeyRef:
                  key: oversea
                  name: cds-properties
            - name: CDS_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  key: k8s_cluster_id
                  name: cds-properties
            - name: CDS_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: cds-properties
                  key: openapi_host
          image: {{ index .Values.container "csi-controller-server" "image" "repository" }}:{{index .Values.container "csi-controller-server" "image" "tag" }}
          imagePullPolicy: {{ index .Values.container "csi-controller-server" "image" "pullPolicy" }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - ps -ef | grep cds-csi-driver | grep eks-disk.csi.cds.net | grep -v grep
            failureThreshold: 8
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 15
          name: csi-controller-server
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 100m
              memory: 100Mi
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /var/log/
              name: host-log
            - mountPath: /socketDir/
              name: socket-dir
            - mountPath: /host/etc
              name: etc
        - args:
            - --csi-address=$(ADDRESS)
            - --v=5
          env:
            - name: ADDRESS
              value: /socketDir/csi.sock
          image: {{index .Values.container "csi-provisioner" "image" "repository" }}:{{ index .Values.container "csi-provisioner" "image" "tag" }}
          imagePullPolicy: {{ index .Values.container "csi-provisioner" "image" "pullPolicy" }}
          name: csi-provisioner
          volumeMounts:
            - mountPath: /socketDir
              name: socket-dir
        - args:
            - --csi-address=/csi/csi.sock
            - --health-port=9811
          image: {{ index .Values.container "liveness-probe-controller" "image" "repository" }}:{{ index .Values.container "liveness-probe-controller" "image" "tag" }}
          imagePullPolicy: {{ index .Values.container "liveness-probe-controller" "image" "pullPolicy" }}
          name: liveness-probe-controller
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
        - args:
            - --csi-address=$(ADDRESS)
            - --v=5
            - --leader-election=true
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          image: {{ index .Values.container "csi-attacher" "image" "repository" }}:{{ index .Values.container "csi-attacher" "image" "tag" }}
          imagePullPolicy: {{ index .Values.container "csi-attacher" "image" "pullPolicy" }}
          name: csi-attacher
          volumeMounts:
            - mountPath: /var/lib/csi/sockets/pluginproxy/
              name: socket-dir
        - args:
            - --v=5
            - --csi-address=$(ADDRESS)
            - --http-endpoint=:8080
            - --retry-interval-max=10s
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          name: csi-resizer
          image: {{ index .Values.container "csi-resizer" "image" "repository" }}:{{ index .Values.container "csi-resizer" "image" "tag" }}
          imagePullPolicy: {{ index .Values.container "csi-resizer" "image" "pullPolicy" }}
          ports:
            - containerPort: 8080
              name: http-endpoint
              protocol: TCP
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
      hostNetwork: true
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      nodeSelector:
        node-role.kubernetes.io/control-plane: ''
      priorityClassName: system-cluster-critical
      serviceAccount: eks-disk-cds-csi-sa
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.eks.net/infra
          operator: Exists

      volumes:
        - emptyDir: {}
          name: socket-dir
        - hostPath:
            path: /var/log/
          name: host-log
        - hostPath:
            path: /etc
          name: etc
  strategy:
    type: RollingUpdate
