apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100  
      grpc_server_max_recv_msg_size: 10485760
      grpc_server_max_send_msg_size: 10485760
      http_server_read_timeout: 300s
      http_server_write_timeout: 300s

    memberlist:
      join_members: ["loki-0.loki-svc:7946"]
      dead_node_reclaim_time: 30s
      gossip_to_dead_nodes_time: 15s
      left_ingesters_timeout: 30s
      bind_addr: ['0.0.0.0']
      bind_port: 7946
      gossip_interval: 2s

    common:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
      replication_factor: 1
      path_prefix: /loki

    schema_config:
      configs:
      - from: 2020-05-15
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

    storage_config:
      filesystem:
        directory: /loki
      max_chunk_batch_size: 100
      max_parallel_get_chunk: 300

    limits_config:
      ingestion_rate_mb: 32
      ingestion_burst_size_mb: 64
      query_timeout: 5m
      tsdb_max_query_parallelism: 2048
      split_queries_by_interval: 15m
      retention_period: {{ .Values.loki.retention }}
      max_query_length: {{ .Values.loki.maxQueryLength }}
      deletion_mode: filter-and-delete
      
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
      retention_delete_delay: 1h
      retention_delete_worker_count: 150
      working_directory: /loki/retention

    table_manager:
      retention_deletes_enabled: true
      retention_period: {{ .Values.loki.retention }}