# ==========================================
# Component Configuration
# ==========================================
loki:
  retention: 30d
  maxQueryLength: 30d
  storage:
    storageClassName: default-local-sc
    size: 20Gi

ingress:
  enabled: false
  host: ""

# ==========================================
# Container Configuration (Unified Namespace)
# ==========================================
container:
  # Loki main container
  loki:
    image:
      repository: registry-cds.yun-paas.com/cds-eks/loki
      tag: "3.2.0"
  
  # Promtail log collection
  promtail-container:
    image:
      repository: registry-cds.yun-paas.com/cds-eks/promtail
      tag: "3.2.0"
  
  # Kubernetes event exporter
  event-exporter:
    image:
      repository: registry-cds.yun-paas.com/cds-eks/kubernetes-event-exporter
      tag: v1.7

