# Default values for csi-oss.
# This is a YAML-formatted file.
# Declare variables to be substituted into your templates.

# ==========================================
# Component Configuration
# ==========================================
# Note: Most component configurations are fixed in template files

# Fixed values:
# - namespace: kube-system
# - driver name: oss.csi.cds.net
# - serviceAccount: oss-cds-csi-sa
# - node:
#   - priorityClassName: system-node-critical
#   - tolerations: Exists (all taints)
#   - nodeAffinity: node.kubernetes.io/host-type in [ecs, bms]
#   - resources: See daemonset.yaml for container resources
# - RBAC: See clusterrole.yaml for full permissions

# ==========================================
# Container Configuration (Unified Namespace)
# ==========================================
container:
  # OSS Server - InitContainer
  install-oss-server:
    image:
      repository: registry-cds.yun-paas.com/cds-eks/oss-server
      pullPolicy: Always
      tag: "v1.0.1"

  # CDS CSI Driver - OSS Node
  oss-csi-node-server:
    image:
      repository: registry-cds.yun-paas.com/cds-eks/cds-csi-driver
      pullPolicy: Always
      tag: "v2.1.2"

  # Node Driver Registrar
  oss-driver-registrar:
    image:
      repository: registry-cds.yun-paas.com/cds-eks/csi-node-driver-registrar
      pullPolicy: Always
      tag: "v2.9.0"

  # Liveness Probe - Node
  oss-liveness-probe:
    image:
      repository: registry-cds.yun-paas.com/cds-eks/csi-livenessprobe
      pullPolicy: IfNotPresent
      tag: "v2.11.0"
