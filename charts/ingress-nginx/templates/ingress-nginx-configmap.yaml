{{- if .Values.controller.config.create }}

apiVersion: v1
data:
  allow-snippet-annotations: "{{ .Values.controller.config.allowSnippetAnnotations }}"
  ssl-reject-handshake: "false"
  proxy-buffer-size: "16k"
  proxy-buffers-number: "8"
  proxy-busy-buffers-size: "32k"
  proxy-body-size: "50m"
  use-gzip: "true"
  gzip-level: "6"
  gzip-types: "application/javascript application/x-javascript text/javascript text/css application/json application/xml text/plain image/svg+xml font/woff2"
  keep-alive: "75"
  keep-alive-requests: "1000"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.7.1
  name: {{ .Values.controller.config.name }}
  namespace: {{ .Values.namespace.name }}

{{- end }}

