apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: vpc-cni-validating-webhook
  labels:
    app: vpc-cni
webhooks:
  - admissionReviewVersions: ["v1beta1", "v1"]
    clientConfig:
      caBundle: ""
      service:
        name: vpc-cni-webhook
        namespace: kube-system
        port: 443
        path: "/validate"
    failurePolicy: Fail
    matchPolicy: Equivalent
    name: vpc-cni-v1.validating.vpc-cni
    rules:
    - apiGroups: ["networks.networking.kubernetes.com"]
      apiVersions: ["v1"]
      operations: ["CREATE", "DELETE"]
      resources: ["networks", "subnets"]
    sideEffects: None
    timeoutSeconds: 10
  - admissionReviewVersions: ["v1beta1", "v1"]
    clientConfig:
      caBundle: ""
      service:
        name: vpc-cni-webhook
        namespace: kube-system
        port: 443
        path: "/validate"
    failurePolicy: Ignore
    matchPolicy: Equivalent
    name: core-v1.validating.vpc-cni
    objectSelector:
      matchExpressions:
        - key: webhook.vpc-cni.io/ignore
          operator: NotIn
          values: ["TRUE", "true"]
        - key: app
          operator: NotIn
          values: [ "kube-proxy" ]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    sideEffects: None
    timeoutSeconds: 10

---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: vpc-cni-mutating-webhook
  labels:
    app: vpc-cni
webhooks:
  - admissionReviewVersions: ["v1beta1", "v1"]
    clientConfig:
      caBundle: ""
      service:
        name: vpc-cni-webhook
        namespace: kube-system
        port: 443
        path: "/mutate"
    failurePolicy: Ignore
    matchPolicy: Equivalent
    name: core-v1.mutating.vpc-cni
    objectSelector:
      matchExpressions:
        - key: webhook.vpc-cni.io/ignore
          operator: NotIn
          values: ["TRUE", "true"]
        - key: app
          operator: NotIn
          values: [ "kube-proxy" ]
    reinvocationPolicy: Never
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    sideEffects: None
    timeoutSeconds: 10

