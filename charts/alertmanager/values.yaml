# ==========================================
# Component Configuration
# ==========================================
alertmanager:
  # HTTP Basic Authentication Configuration
  auth:
    enabled: true  # Set to false to skip Secret creation
    # Authentication info in htpasswd format (username:password hash)
    # Format: username:$apr1$hash...
    # Multiple users separated by newline
    htpasswd: admin:admin

ingress:
  hosts:
    - k8s.alarm
    - k8s_internal.alarm

# Prometheus Rules Configuration
prometheusRules:
  enabled: false  # Set to true to enable 8 predefined alert rules

# ==========================================
# Container Configuration (Unified Namespace)
# ==========================================
container:
  # Alertmanager main container
  alertmanager:
    image:
      repository: capitalonline/alertmanager
      tag: v0.26.0
  
  # Config Reloader (Auto-injected by Prometheus Operator)
  config-reloader:
    image:
      repository: capitalonline/prometheus-config-reloader
      tag: v0.67.1
  
  # Webhook Adapter (Separate Deployment)
  webhook:
    image:
      repository: capitalonline/alertmanager-webhook-adapter
      tag: v1.1.7
