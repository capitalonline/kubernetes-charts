apiVersion: v1
kind: Secret
type: Opaque
metadata:
  labels:
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/instance: main
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 0.26.0
  name: alertmanager-main
  namespace: monitoring
stringData:
  alertmanager.yaml: |-
    global:
        resolve_timeout: "5m"
    receivers:
    - name: "local"
    route:
      group_by:
        - "severity"
      group_interval: "5m"
      group_wait: "30s"
      receiver: "local"
      repeat_interval: "12h"
      routes:
        - receiver: "local"
          matchers:
            - "severity = warning"

